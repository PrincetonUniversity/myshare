site_name: "myshare"
site_url: https://princetonuniversity.github.io/myshare/
repo_url: "https://github.com/PrincetonUniversity/myshare"
repo_name: PrincetonUniversity/myshare
nav:
  - What is myshare?: index.md
  - Installation:
    - Overview:       setup/install.md
  - Configuration:
    - Overview:       config/config.md
  - Contributions:    contributions.md
theme:
  name: material
  features:
    - navigation.footer
  palette:
    # light mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Light mode
      primary: green
      accent: blue
    # dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Dark mode
      primary: green
      accent: deep purple
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  # content tabs
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/PrincetonUniversity/myshare
  generator: false

copyright: "&copy;2026 Princeton University. All rights reserved."
